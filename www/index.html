<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StopWay</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-text: #04131d;
      --danger: #ef4444;
      --snooze: #22c55e;
      --snooze-text: #052e16;
      --border: #475569;
      --shadow: 0 10px 24px rgba(0,0,0,0.35);
      --radius: 16px;
      --font-main: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-display: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --btn-transform: none;
      --btn-border-width: 1.5px;
      --backdrop-blur: 0px;
      --wallpaper-img: none;
    }

    body[data-theme="cartoon"] {
      --bg: #fef08a;
      --surface: #ffffff;
      --surface-2: #fde047;
      --text: #111827;
      --muted: #374151;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --danger: #dc2626;
      --snooze: #16a34a;
      --snooze-text: #ffffff;
      --border: #111827;
      --shadow: 5px 5px 0px #111827;
      --radius: 22px 10px 20px 12px;
      --font-main: 'Trebuchet MS', 'Comic Sans MS', system-ui, sans-serif;
      --font-display: 'Arial Black', Impact, 'Trebuchet MS', sans-serif;
      --btn-transform: rotate(-0.8deg);
      --btn-border-width: 3.5px;
      --backdrop-blur: 0px;
      background-image: radial-gradient(#111827 1.1px, transparent 1.1px);
      background-size: 18px 18px;
    }
    body[data-theme="cartoon"] .dest-btn:nth-child(even) { transform: rotate(0.8deg); }
    body[data-theme="cartoon"] .dest-btn:active,
    body[data-theme="cartoon"] .action-btn:active,
    body[data-theme="cartoon"] .icon-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0px #111827;
    }

    body[data-theme="gothic"] {
      --bg: #09070a;
      --surface: #161118;
      --surface-2: #241926;
      --text: #f3ece8;
      --muted: #b79ea8;
      --accent: #b91c1c;
      --accent-text: #fff5f5;
      --danger: #991b1b;
      --snooze: #7f1d1d;
      --snooze-text: #fef2f2;
      --border: #6b5b6e;
      --shadow: inset 0 0 0 1px rgba(226, 212, 218, 0.16), 0 12px 26px rgba(0, 0, 0, 0.78);
      --radius: 4px 18px 4px 18px;
      --font-main: Georgia, 'Times New Roman', serif;
      --font-display: Palatino, 'Book Antiqua', Georgia, serif;
      --btn-transform: none;
      --btn-border-width: 2px;
      --backdrop-blur: 0px;
      background-image: linear-gradient(180deg, rgba(127,29,29,0.16) 0%, rgba(9,7,10,0.96) 55%);
    }
    body[data-theme="gothic"] .dest-btn::before,
    body[data-theme="gothic"] .panel::before {
      content: "✦";
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 0.72rem;
      color: var(--muted);
      opacity: 0.7;
    }

    body[data-theme="renaissance"] {
      --bg: #241911;
      --surface: #f4ead5;
      --surface-2: #e6d5b2;
      --text: #2a1b10;
      --muted: #6b4e34;
      --accent: #9a3412;
      --accent-text: #fffbeb;
      --danger: #881337;
      --snooze: #1e4620;
      --snooze-text: #f0fdf4;
      --border: #b48a3c;
      --shadow: inset 0 0 0 2px #d4af37, 0 8px 20px rgba(0, 0, 0, 0.45);
      --radius: 10px;
      --font-main: Georgia, 'Times New Roman', serif;
      --font-display: Georgia, 'Times New Roman', serif;
      --btn-transform: none;
      --btn-border-width: 2.5px;
      --backdrop-blur: 0px;
      background-image: radial-gradient(circle at top, rgba(212,175,55,0.16), transparent 60%), linear-gradient(180deg, #2b1d13 0%, #19100a 100%);
    }
    body[data-theme="renaissance"] .topbar,
    body[data-theme="renaissance"] .prompt-title,
    body[data-theme="renaissance"] .modal-title,
    body[data-theme="renaissance"] .drawer-title { color: var(--text); }
    body[data-theme="renaissance"] .topbar { background: #f4ead5; }

    body[data-theme="punk"] {
      --bg: #111111;
      --surface: #1b1b1b;
      --surface-2: #2a2a2a;
      --text: #fafafa;
      --muted: #d4d4d8;
      --accent: #f43f5e;
      --accent-text: #ffffff;
      --danger: #e11d48;
      --snooze: #a3e635;
      --snooze-text: #111111;
      --border: #f43f5e;
      --shadow: 4px 4px 0px #a3e635;
      --radius: 2px 12px 3px 9px;
      --font-main: system-ui, -apple-system, sans-serif;
      --font-display: Impact, 'Arial Black', sans-serif;
      --btn-transform: skewX(-4deg);
      --btn-border-width: 2px;
      --backdrop-blur: 0px;
      background-image: repeating-linear-gradient(-45deg, rgba(244,63,94,0.06) 0, rgba(244,63,94,0.06) 8px, transparent 8px, transparent 16px);
    }

    body[data-theme="glass"] {
      --backdrop-blur: 14px;
      --btn-transform: none;
      --btn-border-width: 1.5px;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    body[data-theme="glass"]:not([data-has-wallpaper="true"]) {
      background-image:
        radial-gradient(circle at 18% 22%, rgba(56, 189, 248, 0.55), transparent 45%),
        radial-gradient(circle at 82% 28%, rgba(250, 204, 21, 0.55), transparent 45%),
        radial-gradient(circle at 50% 82%, rgba(244, 63, 94, 0.45), transparent 50%),
        linear-gradient(135deg, #e2e8f0 0%, #64748b 50%, #0f172a 100%);
    }
    body[data-theme="glass"][data-has-wallpaper="true"] { background-image: var(--wallpaper-img); }
    body[data-theme="glass"][data-glass-polarity="dark-ui"] {
      --bg: #1e293b; --surface: rgba(15, 23, 42, 0.62); --surface-2: rgba(30, 41, 59, 0.68);
      --text: #f8fafc; --muted: #e2e8f0; --accent: #38bdf8; --accent-text: #04131d;
      --danger: #ef4444; --snooze: #22c55e; --snooze-text: #052e16;
      --border: rgba(255, 255, 255, 0.34); --shadow: 0 10px 26px rgba(0, 0, 0, 0.32);
    }
    body[data-theme="glass"][data-glass-polarity="light-ui"] {
      --bg: #cbd5e1; --surface: rgba(255, 255, 255, 0.68); --surface-2: rgba(241, 245, 249, 0.74);
      --text: #0f172a; --muted: #1e293b; --accent: #0284c7; --accent-text: #ffffff;
      --danger: #dc2626; --snooze: #16a34a; --snooze-text: #ffffff;
      --border: rgba(15, 23, 42, 0.28); --shadow: 0 10px 26px rgba(15, 23, 42, 0.18);
    }
    body[data-theme="glass"] .topbar,
    body[data-theme="glass"] .dest-btn,
    body[data-theme="glass"] .panel,
    body[data-theme="glass"] .drawer,
    body[data-theme="glass"] .modal-card,
    body[data-theme="glass"] .icon-btn,
    body[data-theme="glass"] .action-btn,
    body[data-theme="glass"] .ad-slot {
      backdrop-filter: blur(var(--backdrop-blur));
      -webkit-backdrop-filter: blur(var(--backdrop-blur));
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100dvh; font-family: var(--font-main);
      background-color: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .app-shell {
      width: 100%; max-width: 640px; margin: 0 auto; padding: 12px 14px 20px;
      flex: 1; display: flex; flex-direction: column; gap: 12px;
    }
    .topbar {
      position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: var(--surface); border: var(--btn-border-width) solid var(--border);
      border-radius: var(--radius); padding: 10px 12px; box-shadow: var(--shadow);
    }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .brand-icon { width: 28px; height: 28px; flex: 0 0 28px; }
    .brand-title {
      font-family: var(--font-display); font-weight: 800; font-size: 1.05rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .top-controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .threshold-select, .icon-btn, .action-btn, .dest-btn {
      font-family: inherit; color: var(--text); background: var(--surface-2);
      border: var(--btn-border-width) solid var(--border); border-radius: var(--radius);
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .threshold-select { padding: 7px 9px; font-size: 0.82rem; font-weight: 700; }
    .icon-btn {
      width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 700; box-shadow: var(--shadow);
    }
    .icon-btn.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .prompt-title {
      margin: 2px 0 0; text-align: center; font-family: var(--font-display);
      font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em;
    }
    .destinations-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .dest-btn {
      position: relative; min-height: 76px; padding: 10px 12px; background: var(--surface);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; gap: 3px; box-shadow: var(--shadow); transform: var(--btn-transform);
    }
    .dest-btn:active, .action-btn:active, .icon-btn:active { transform: scale(0.98); }
    .dest-btn.selected { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .dest-index { font-size: 0.72rem; font-weight: 800; opacity: 0.72; }
    .dest-name { font-family: var(--font-display); font-size: 1.05rem; font-weight: 800; line-height: 1.2; word-break: break-word; }
    .dest-sub { font-size: 0.73rem; opacity: 0.85; }
    .panel {
      position: relative; background: var(--surface); border: var(--btn-border-width) solid var(--border);
      border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 10px;
    }
    .status-line { font-size: 0.9rem; font-weight: 700; line-height: 1.4; }
    .status-detail { font-size: 0.8rem; color: var(--muted); line-height: 1.35; }
    .action-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .action-btn { padding: 10px 14px; font-size: 0.88rem; font-weight: 800; box-shadow: var(--shadow); }
    .action-btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .action-btn.danger { background: var(--danger); color: #ffffff; border-color: var(--danger); }
    .sound-controls { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .sound-select, .text-input, .num-input {
      width: 100%; padding: 9px 10px; border-radius: 10px; border: 1.5px solid var(--border);
      background: var(--surface-2); color: var(--text); font-family: inherit; font-size: 0.88rem; font-weight: 600;
    }
    .extra-audio-row {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      justify-content: space-between; font-size: 0.82rem;
    }
    .toggle-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 999px;
      background: var(--surface-2); border: 1.5px solid var(--border); font-weight: 700; cursor: pointer;
    }
    .custom-file-badge { color: var(--muted); font-size: 0.78rem; word-break: break-all; }
    .drawer {
      display: none; background: var(--surface); border: var(--btn-border-width) solid var(--border);
      border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); gap: 10px;
    }
    .drawer.open { display: flex; flex-direction: column; }
    .drawer-title { font-family: var(--font-display); font-size: 0.96rem; font-weight: 800; margin: 0; }
    .theme-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .theme-chip {
      padding: 9px 10px; border-radius: 10px; border: 1.5px solid var(--border);
      background: var(--surface-2); color: var(--text); font-weight: 700; font-size: 0.84rem;
      cursor: pointer; text-align: left;
    }
    .theme-chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .glass-box, .sim-box {
      display: none; flex-direction: column; gap: 8px; padding-top: 6px; border-top: 1px dashed var(--border);
    }
    .glass-box.visible, .sim-box { display: flex; }
    .ad-slot {
      background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius);
      padding: 9px 12px; text-align: center; font-size: 0.75rem; color: var(--muted);
    }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(2, 6, 23, 0.72); display: none;
      align-items: center; justify-content: center; padding: 14px; z-index: 50; overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      position: relative; width: 100%; max-width: 480px; background: var(--surface); color: var(--text);
      border: var(--btn-border-width) solid var(--border); border-radius: var(--radius); padding: 16px;
      box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px;
      max-height: 92dvh; overflow-y: auto;
    }
    .help-close-x {
      position: sticky; top: 0; margin-left: auto; width: 34px; height: 34px; border-radius: 999px;
      border: 1.5px solid var(--border); background: var(--surface-2); color: var(--text);
      font-size: 1rem; font-weight: 800; cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; z-index: 2;
    }
    .help-list { display: flex; flex-direction: column; gap: 10px; font-size: 0.9rem; line-height: 1.5; }
    .help-item { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
    .modal-title { margin: 0; font-family: var(--font-display); font-size: 1.1rem; font-weight: 800; }
    .field-group { display: flex; flex-direction: column; gap: 5px; }
    .field-label { font-size: 0.8rem; font-weight: 700; color: var(--muted); }
    .search-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .search-results { display: flex; flex-direction: column; gap: 6px; max-height: 150px; overflow-y: auto; }
    .search-item-btn {
      width: 100%; text-align: left; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text); font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    html[dir="rtl"] .search-item-btn, html[dir="rtl"] .theme-chip { text-align: right; }
    #mapContainer {
      width: 100%; height: 210px; border-radius: 12px; border: 1.5px solid var(--border);
      overflow: hidden; z-index: 1;
    }
    .coord-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .alarm-overlay {
      position: fixed; inset: 0; background: #090d16; color: #ffffff; z-index: 100;
      display: none; flex-direction: column; justify-content: space-between; padding: 20px 18px 24px;
    }
    .alarm-overlay.active { display: flex; }
    .alarm-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .alarm-heading { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; margin: 0 0 6px; }
    .alarm-sub { font-size: 0.95rem; color: #cbd5e1; }
    .dismiss-tiny-btn {
      padding: 6px 9px; font-size: 0.7rem; font-weight: 700; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.25); background: rgba(127, 29, 29, 0.55);
      color: #fecaca; cursor: pointer; flex-shrink: 0;
    }
    .snooze-giant-btn {
      width: 100%; min-height: 220px; border-radius: 28px; border: 4px solid #86efac;
      background: var(--snooze); color: var(--snooze-text); font-family: var(--font-display);
      font-size: 2.3rem; font-weight: 900; letter-spacing: 0.02em; cursor: pointer;
      box-shadow: 0 0 40px rgba(34, 197, 94, 0.35); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
    }
    .snooze-sub { font-family: var(--font-main); font-size: 1rem; font-weight: 700; opacity: 0.92; }
    .alarm-footer-note { text-align: center; font-size: 0.78rem; color: #94a3b8; }
    .sw-flag-wave {
      display: inline-block; transform-origin: bottom center;
      animation: swFlagWave 1.35s ease-in-out infinite; font-size: 2.6rem;
    }
    @keyframes swFlagWave {
      0%, 100% { transform: rotate(-12deg); }
      50% { transform: rotate(14deg); }
    }
    .sw-goodbye-banner {
      position: fixed; inset: 0; z-index: 200; display: none; align-items: center;
      justify-content: center; padding: 20px; background: rgba(9, 13, 22, 0.84);
      backdrop-filter: blur(5px);
    }
    .sw-goodbye-banner.open { display: flex; }
    .sw-goodbye-card {
      width: 100%; max-width: 440px; background: var(--surface); color: var(--text);
      border: var(--btn-border-width) solid var(--border); border-radius: var(--radius);
      padding: 22px 18px; text-align: center; box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 10px;
    }
    .sw-check-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border);
      background: var(--surface-2); color: var(--text); font-weight: 700; text-align: left; cursor: pointer;
    }
    .sw-check-row.done { border-color: #16a34a; }
  </style>
</head>
<body data-theme="classic" data-glass-polarity="dark-ui">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 4C20.4 4 11 13.4 11 25c0 15.8 21 35 21 35s21-19.2 21-35C53 13.4 43.6 4 32 4z" fill="#ef4444" stroke="#ffffff" stroke-width="3"/>
          <circle cx="32" cy="25" r="13" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
          <path d="M18 13l5-5M46 13l-5-5" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
          <path d="M32 18v7l5 3" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <span class="brand-title">StopWay</span>
      </div>

      <div class="top-controls">
        <select id="thresholdSelect" class="threshold-select" aria-label="Riasztási távolság">
          <option value="300">300 m</option>
          <option value="500">500 m</option>
          <option value="1000" selected>1 km</option>
          <option value="1500">1,5 km</option>
          <option value="2000">2 km</option>
          <option value="3000">3 km</option>
          <option value="5000">5 km</option>
        </select>
        <button id="langBtn" class="icon-btn" type="button" title="Nyelv / Language">🌐</button>
        <button id="helpBtn" class="icon-btn" type="button" title="Help / Súgó">❓</button>
        <button id="voiceBtn" class="icon-btn" type="button" title="Hangvezérlés">🎤</button>
        <button id="themeBtn" class="icon-btn" type="button" title="Dizájn és szimuláció">🎨</button>
        <button id="editModeBtn" class="icon-btn" type="button" title="Helyek szerkesztése">✏️</button>
      </div>
    </header>

    <div id="langMenu" class="panel" style="display:none; gap:8px;">
      <div id="langMenuTitle" class="drawer-title">Select language</div>
      <div id="langList" class="theme-grid"></div>
    </div>

    <div id="helpModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="helpModalTitle">
      <div class="modal-card">
        <button id="closeHelpBtn" class="help-close-x" type="button" aria-label="Close">✕</button>
        <h2 id="helpModalTitle" class="modal-title"></h2>
        <div id="helpBodyList" class="help-list"></div>
      </div>
    </div>
    <h1 class="prompt-title">Where are you heading?</h1>

    <main id="destinationsGrid" class="destinations-grid" aria-label="Saved destinations"></main>

    <section class="panel" aria-live="polite">
      <div id="statusLine" class="status-line"></div>
      <div id="statusDetail" class="status-detail"></div>

      <div class="action-row">
        <button id="toggleWatchBtn" class="action-btn primary" type="button">Start watching</button>
        <button id="stopWatchBtn" class="action-btn danger" type="button" style="display:none;">Stop watching</button>
      </div>

      <div class="sound-controls">
        <select id="soundSelect" class="sound-select" aria-label="Alarm sound"></select>
        <button id="previewSoundBtn" class="action-btn" type="button">Test sound</button>
      </div>

      <div class="extra-audio-row">
        <label class="toggle-pill">
          <input id="loudModeToggle" type="checkbox" checked />
          <span>Boost volume (with music)</span>
        </label>
        <button id="pickAudioBtn" class="action-btn" type="button">Load custom sound</button>
        <input id="customAudioInput" type="file" accept="audio/*" style="display:none;" />
      </div>
      <div id="customAudioInfo" class="custom-file-badge"></div>
    </section>

    <section id="themeDrawer" class="drawer" aria-label="Appearance and simulation">
      <h2 id="themeDrawerTitle" class="drawer-title">Appearance</h2>
      <div class="theme-grid">
