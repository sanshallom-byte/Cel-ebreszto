<!DOCTYPE html>
<html lang="hu" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StopWay</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --surface: rgba(30, 41, 59, 0.78);
      --surface-strong: rgba(15, 23, 42, 0.92);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --warn: #f59e0b;
      --border: rgba(255, 255, 255, 0.14);
      --radius: 18px;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    body[data-theme="glass"] {
      --bg-1: #0ea5e9;
      --bg-2: #312e81;
      --surface: rgba(255, 255, 255, 0.16);
      --surface-strong: rgba(15, 23, 42, 0.72);
      --border: rgba(255, 255, 255, 0.28);
    }
    body[data-theme="glass"].flipped .card {
      background: rgba(15, 23, 42, 0.65);
    }

    body[data-theme="cartoon"] {
      --bg-1: #fde047;
      --bg-2: #fb7185;
      --surface: #fffbeb;
      --surface-strong: #fef08a;
      --text: #1e1b4b;
      --muted: #4c1d95;
      --accent: #2563eb;
      --accent-2: #16a34a;
      --border: #1e1b4b;
      --shadow: 5px 5px 0 #1e1b4b;
    }

    body[data-theme="gothic"] {
      --bg-1: #09090b;
      --bg-2: #270914;
      --surface: rgba(24, 14, 19, 0.9);
      --surface-strong: #12090d;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #e11d48;
      --accent-2: #a855f7;
      --border: rgba(225, 29, 72, 0.38);
    }

    body[data-theme="renaissance"] {
      --bg-1: #2c1810;
      --bg-2: #5c3a21;
      --surface: rgba(69, 42, 22, 0.88);
      --surface-strong: #382010;
      --text: #fef3c7;
      --muted: #fde68a;
      --accent: #eab308;
      --accent-2: #10b981;
      --border: rgba(234, 179, 8, 0.4);
    }

    body[data-theme="punk"] {
      --bg-1: #111827;
      --bg-2: #064e3b;
      --surface: rgba(17, 24, 39, 0.92);
      --surface-strong: #030712;
      --text: #ecfdf5;
      --muted: #6ee7b7;
      --accent: #ec4899;
      --accent-2: #a3e635;
      --border: #ec4899;
      --shadow: 4px 4px 0 #ec4899;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
      background-attachment: fixed;
      padding: 16px;
      transition: background 0.3s ease, color 0.2s ease;
    }

    .app {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .controls-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    select, button, input {
      font: inherit;
      color: inherit;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-strong);
      padding: 10px 12px;
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    button:active { transform: scale(0.97); }

    .card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .status-box {
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 8px;
      min-height: 1.4em;
    }

    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .btn-start {
      flex: 1;
      min-width: 180px;
      background: var(--accent-2);
      color: #062814;
      border: none;
      padding: 14px 18px;
      font-size: 1.05rem;
      font-weight: 800;
    }

    .btn-start.blinking {
      animation: pulseBlink 1s infinite alternate;
    }

    @keyframes pulseBlink {
      from { opacity: 1; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.75); }
      to { opacity: 0.65; box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
    }

    .btn-stop {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 14px 18px;
    }

    .places-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .place-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      background: var(--surface-strong);
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
    }

    .place-item.selected {
      outline: 2px solid var(--accent);
      border-color: var(--accent);
    }

    .place-meta {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: 100%;
      max-width: 460px;
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .arrived-banner {
      border: 2px solid var(--accent-2);
    }

    .flag {
      font-size: 2rem;
      display: inline-block;
      margin-inline-end: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }

    .hint {
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body data-theme="default">
  <div class="app">
    <header class="topbar">
      <div class="brand" id="brandTitle">StopWay</div>
      <div class="controls-row">
        <select id="langSelect" aria-label="Language"></select>
        <select id="themeSelect" aria-label="Theme"></select>
        <select id="soundSelect" aria-label="Sound"></select>
      </div>
    </header>

    <section class="card">
      <div id="promptTitle">Válassz úti célt, és indítsd el a figyelést!</div>
      <div class="action-row">
        <button class="btn-start blinking" id="startBtn">Indítás</button>
        <button class="btn-stop" id="stopBtn" disabled>Leállítás</button>
        <button id="previewSoundBtn">Hangpróba</button>
      </div>
      <div class="controls-row" style="margin-top:12px;">
        <label><input type="checkbox" id="loudModeToggle" /> <span id="loudModeLabel">Hangerős mód</span></label>
        <label><input type="checkbox" id="editModeToggle" /> <span id="editModeLabel">Szerkesztő mód</span></label>
        <select id="thresholdSelect">
          <option value="200">200 m</option>
          <option value="500" selected>500 m</option>
          <option value="1000">1000 m</option>
        </select>
      </div>
      <div class="status-box" id="statusBox"></div>
    </section>

    <section class="card" id="arrivedCard" style="display:none;">
      <div class="arrived-banner card">
        <div><span class="flag">🏁</span><strong id="arrivedTitle">Megérkeztél!</strong></div>
        <p id="arrivedDesc">Elérted a kiválasztott megállót.</p>
        <div class="action-row">
          <button id="restartBtn" class="btn-start">Újrakezdés</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div id="choosePlaceTitle">Megállók / Úti célok</div>
      <div class="hint" id="tapHint">Koppints egy helyre a kiválasztáshoz, vagy szerkeszd bekapcsolt szerkesztő móddal.</div>
      <div class="places-grid" id="placesGrid"></div>
    </section>
  </div>

  <!-- Általános megerősítő / figyelmeztető modál -->
  <div class="modal-backdrop" id="confirmModal">
    <div class="modal">
      <h3 id="modalTitle" style="margin-top:0;">Megerősítés</h3>
      <p id="modalText"></p>
      <div class="action-row">
        <button id="modalConfirmBtn" class="btn-start">Rendben</button>
        <button id="modalCancelBtn">Mégsem</button>
      </div>
    </div>
  </div>

  <!-- Hely szerkesztő modál -->
  <div class="modal-backdrop" id="editModal">
    <div class="modal">
      <h3 id="editModalTitle" style="margin-top:0;">Hely beállítása</h3>
      <div class="field">
        <label id="editNameLabel" for="placeNameInput">Megálló neve</label>
        <input id="placeNameInput" type="text" />
      </div>
      <div class="field">
        <label id="coordsLabel">Koordináták (szélesség, hosszúság)</label>
        <div class="controls-row">
          <input id="latInput" type="number" step="any" placeholder="47.4979" style="flex:1;" />
          <input id="lngInput" type="number" step="any" placeholder="19.0402" style="flex:1;" />
        </div>
      </div>
      <div class="action-row">
        <button id="useGpsBtn">Jelenlegi GPS</button>
        <button id="savePlaceBtn" class="btn-start">Mentés</button>
        <button id="cancelEditBtn">Mégsem</button>
      </div>
    </div>
  </div>

    const TRANSLATIONS = {};
    LANGUAGES.forEach(lang => {
      const base = BASE_DICT[lang.code] || BASE_DICT.en;
      const extra = EXTRA_LANGS[lang.code] || {};
      const stopPrefix = extra.stopLabel || base.stopLabel || "Stop";
      TRANSLATIONS[lang.code] = {
        ...BASE_DICT.en,
        ...base,
        ...extra,
        themes: { ...BASE_DICT.en.themes, ...(base.themes || {}), ...(extra.themes || {}) },
        sounds: { ...BASE_DICT.en.sounds, ...(base.sounds || {}), ...(extra.sounds || {}) },
        defaultPlaces: base.defaultPlaces || Array.from({ length: 10 }, (_, idx) => `${stopPrefix} ${idx + 1}`)
      };
    });

    const state = {
      lang: "hu",
      theme: "default",
      sound: "chime",
      threshold: 500,
      loudMode: false,
      editMode: false,
      watching: false,
      selectedIndex: 0,
      places: Array.from({ length: 10 }, (_, i) => ({
        name: TRANSLATIONS.hu.defaultPlaces[i],
        lat: null,
        lng: null
      })),
      lastMoveTime: Date.now(),
      lastPos: null
    };

    let watchId = null;
    let pendingModalAction = null;
    let editingIndex = null;

    const el = id => document.getElementById(id);

    function t(key) {
      const dict = TRANSLATIONS[state.lang] || TRANSLATIONS.hu;
      return dict[key] !== undefined ? dict[key] : (TRANSLATIONS.en[key] || key);
    }

    function saveState() {
      try {
        localStorage.setItem("stopway_state_v1", JSON.stringify(state));
      } catch (_) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem("stopway_state_v1");
        if (!raw) return;
        const parsed = JSON.parse(raw);
        Object.assign(state, parsed);
      } catch (_) {}
    }

    function playTone(type = "chime") {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type === "siren" ? "sawtooth" : type === "pulse" ? "square" : "sine";
        osc.frequency.setValueAtTime(type === "siren" ? 780 : type === "pulse" ? 520 : 660, ctx.currentTime);
        gain.gain.setValueAtTime(state.loudMode ? 0.6 : 0.2, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (_) {}
    }

    function openConfirm(title, text, onConfirm, onCancel) {
      el("modalTitle").textContent = title;
      el("modalText").textContent = text;
      el("modalConfirmBtn").textContent = t("okBtn");
      el("modalCancelBtn").textContent = t("cancelBtn");
      el("confirmModal").classList.add("open");

      pendingModalAction = {
        confirm: () => {
          el("confirmModal").classList.remove("open");
          if (onConfirm) onConfirm();
        },
        cancel: () => {
          el("confirmModal").classList.remove("open");
          if (onCancel) onCancel();
        }
      };
    }

    function distanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = d => (d * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function triggerArrival() {
      state.watching = false;
      if (watchId !== null && navigator.geolocation) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      playTone(state.sound);
      el("arrivedCard").style.display = "block";
      el("startBtn").disabled = false;
      el("stopBtn").disabled = true;
      el("startBtn").classList.add("blinking");
      saveState();
    }

    function startWatch() {
      el("arrivedCard").style.display = "none";
      const begin = () => {
        state.watching = true;
        state.lastMoveTime = Date.now();
        el("startBtn").disabled = true;
        el("stopBtn").disabled = false;
        el("startBtn").classList.remove("blinking");
        el("statusBox").textContent = t("watchingActive");
        saveState();

        if (!navigator.geolocation) {
          openConfirm(
            t("gpsOffTitle"),
            t("gpsOffText"),
            () => setTimeout(triggerArrival, 2500),
            () => openConfirm(t("cancelWarnTitle"), t("cancelWarnText"), () => stopWatch(true))
          );
          return;
        }

        watchId = navigator.geolocation.watchPosition(
          pos => {
            const { latitude, longitude } = pos.coords;
            if (state.lastPos) {
              const moved = distanceMeters(state.lastPos.lat, state.lastPos.lng, latitude, longitude);
              if (moved > 8) {
                state.lastMoveTime = Date.now();
              } else if (Date.now() - state.lastMoveTime > 60000) {
                el("statusBox").textContent = `${t("watchingActive")} — ${t("stallWarning")}`;
              }
            }
            state.lastPos = { lat: latitude, lng: longitude };

            const target = state.places[state.selectedIndex];
            if (target && typeof target.lat === "number" && typeof target.lng === "number") {
              const dist = distanceMeters(latitude, longitude, target.lat, target.lng);
              el("statusBox").textContent = `${t("watchingActive")} (${Math.round(dist)} m)`;
              if (dist <= state.threshold) {
                triggerArrival();
              }
            }
          },
          () => {
            openConfirm(
              t("gpsOffTitle"),
              t("gpsOffText"),
              () => setTimeout(triggerArrival, 2500),
              () => openConfirm(t("cancelWarnTitle"), t("cancelWarnText"), () => stopWatch(true))
            );
          },
          { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
        );
      };

      begin();
    }

    function stopWatch(force = false) {
      const doStop = () => {
        state.watching = false;
        if (watchId !== null && navigator.geolocation) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
        el("startBtn").disabled = false;
        el("stopBtn").disabled = true;
        el("startBtn").classList.add("blinking");
        el("statusBox").textContent = "";
        saveState();
      };

      if (force) {
        doStop();
        return;
      }

      openConfirm(
        t("stopConfirmTitle"),
        t("stopConfirmText"),
        doStop,
        () => openConfirm(t("cancelWarnTitle"), t("cancelWarnText"))
      );
    }

    function openEditModal(idx) {
      editingIndex = idx;
      const place = state.places[idx];
      el("editModalTitle").textContent = t("editModalTitle");
      el("editNameLabel").textContent = t("editNameLabel");
      el("coordsLabel").textContent = t("coordsLabel");
      el("useGpsBtn").textContent = t("useGpsBtn");
      el("savePlaceBtn").textContent = t("savePlaceBtn");
      el("cancelEditBtn").textContent = t("cancelBtn");

      el("placeNameInput").value = place.name;
      el("latInput").value = place.lat ?? "";
      el("lngInput").value = place.lng ?? "";
      el("editModal").classList.add("open");
    }

    function renderPlaces() {
      const grid = el("placesGrid");
      grid.innerHTML = "";
      state.places.forEach((p, idx) => {
        const item = document.createElement("div");
        item.className = "place-item" + (idx === state.selectedIndex ? " selected" : "");
        const coordsText =
          typeof p.lat === "number" && typeof p.lng === "number"
            ? `${t("coordsSet")} (${p.lat.toFixed(4)}, ${p.lng.toFixed(4)})`
            : t("noCoords");
        item.innerHTML = `<strong>${p.name}</strong><span class="place-meta">${coordsText}</span>`;
        item.addEventListener("click", () => {
          state.selectedIndex = idx;
          saveState();
          renderPlaces();
          if (state.editMode) {
            openEditModal(idx);
          }
        });
        grid.appendChild(item);
      });
    }

    function applyLanguage(code) {
      const langObj = LANGUAGES.find(l => l.code === code) || LANGUAGES[0];
      state.lang = langObj.code;
      document.documentElement.lang = langObj.code;
      document.documentElement.dir = langObj.dir;
      el("langSelect").value = langObj.code;

      const dict = TRANSLATIONS[langObj.code] || TRANSLATIONS.hu;
      el("brandTitle").textContent = t("brandTitle");
      el("promptTitle").textContent = t("promptTitle");
      el("startBtn").textContent = t("startWatch");
      el("stopBtn").textContent = t("stopWatch");
      el("previewSoundBtn").textContent = t("previewSound");
      el("loudModeLabel").textContent = t("loudMode");
      el("editModeLabel").textContent = t("editMode");
      el("choosePlaceTitle").textContent = t("choosePlace");
      el("tapHint").textContent = t("tapHint");
      el("arrivedTitle").textContent = t("arrivedTitle");
      el("arrivedDesc").textContent = t("arrivedDesc");
      el("restartBtn").textContent = t("restartBtn");

      const themeSel = el("themeSelect");
      themeSel.innerHTML = "";
      Object.entries(dict.themes).forEach(([key, label]) => {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = label;
        if (key === state.theme) opt.selected = true;
        themeSel.appendChild(opt);
      });

      const soundSel = el("soundSelect");
      soundSel.innerHTML = "";
      Object.entries(dict.sounds).forEach(([key, label]) => {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = label;
        if (key === state.sound) opt.selected = true;
        soundSel.appendChild(opt);
      });

      state.places.forEach((p, idx) => {
        const looksDefault = Object.values(TRANSLATIONS).some(d => d.defaultPlaces && d.defaultPlaces[idx] === p.name);
        if (looksDefault) {
          p.name = dict.defaultPlaces[idx];
        }
      });

      renderPlaces();
      saveState();
    }

    function init() {
      loadState();
      const langSel = el("langSelect");
      langSel.innerHTML = "";
      LANGUAGES.forEach(l => {
        const opt = document.createElement("option");
        opt.value = l.code;
        opt.textContent = `${l.label} (${l.code})`;
        langSel.appendChild(opt);
      });

      document.body.dataset.theme = state.theme;
      el("loudModeToggle").checked = Boolean(state.loudMode);
      el("editModeToggle").checked = Boolean(state.editMode);
      el("thresholdSelect").value = String(state.threshold || 500);

      langSel.addEventListener("change", e => applyLanguage(e.target.value));
      el("themeSelect").addEventListener("change", e => {
        state.theme = e.target.value;
        document.body.dataset.theme = state.theme;
        if (state.theme === "glass") {
          document.body.classList.toggle("flipped");
        } else {
          document.body.classList.remove("flipped");
        }
        saveState();
      });
      el("soundSelect").addEventListener("change", e => {
        state.sound = e.target.value;
        saveState();
      });
      el("previewSoundBtn").addEventListener("click", () => playTone(state.sound));
      el("loudModeToggle").addEventListener("change", e => {
        state.loudMode = e.target.checked;
        saveState();
      });
      el("editModeToggle").addEventListener("change", e => {
        state.editMode = e.target.checked;
        saveState();
      });
      el("thresholdSelect").addEventListener("change", e => {
        state.threshold = Number(e.target.value) || 500;
        saveState();
      });
      el("startBtn").addEventListener("click", startWatch);
      el("stopBtn").addEventListener("click", () => stopWatch(false));
      el("restartBtn").addEventListener("click", () => {
        el("arrivedCard").style.display = "none";
        startWatch();
      });

      el("modalConfirmBtn").addEventListener("click", () => pendingModalAction?.confirm?.());
      el("modalCancelBtn").addEventListener("click", () => pendingModalAction?.cancel?.());

      el("useGpsBtn").addEventListener("click", () => {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(pos => {
          el("latInput").value = pos.coords.latitude.toFixed(6);
          el("lngInput").value = pos.coords.longitude.toFixed(6);
        });
      });

      el("savePlaceBtn").addEventListener("click", () => {
        if (editingIndex === null) return;
        const nameVal = el("placeNameInput").value.trim();
        const latVal = parseFloat(el("latInput").value);
        const lngVal = parseFloat(el("lngInput").value);
        state.places[editingIndex].name = nameVal || TRANSLATIONS[state.lang].defaultPlaces[editingIndex];
        state.places[editingIndex].lat = Number.isFinite(latVal) ? latVal : null;
        state.places[editingIndex].lng = Number.isFinite(lngVal) ? lngVal : null;
        el("editModal").classList.remove("open");
        editingIndex = null;
        renderPlaces();
        saveState();
      });

      el("cancelEditBtn").addEventListener("click", () => {
        el("editModal").classList.remove("open");
        editingIndex = null;
      });

      applyLanguage(state.lang);
    }

    init();
  </script>
