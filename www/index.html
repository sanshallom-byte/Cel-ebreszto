  <!-- StopWay háttér-túlélő, híd-fogadó és riasztás-összehangoló réteg -->
  <script id="stopway-bg-survival-addon">
    (function () {
      "use strict";

      let pendingAlarmPayload = null;
      let lastBridgeFixAt = 0;
      let lastNativeAlertSentAt = 0;

      function logMsg(tag, detail) {
        try {
          if (typeof window.__swDebugLog === "function") {
            window.__swDebugLog(tag, detail || "");
          }
        } catch (e) {}
      }

      function callNativeAlertBridge(title, body, kind) {
        const now = Date.now();
        if (now - lastNativeAlertSentAt < 4000) return;
        lastNativeAlertSentAt = now;

        const payload = JSON.stringify({
          title: title || "Cél-ébresztő",
          body: body || "Figyelmeztetés a háttérből",
          kind: kind || "ALERT"
        });

        logMsg("NATIVE_ALERT_OUT", `${kind || "ALERT"}: ${title || ""}`);

        try {
          if (window.StopWayNative && typeof window.StopWayNative.triggerNativeAlert === "function") {
            window.StopWayNative.triggerNativeAlert(payload);
            return;
          }
        } catch (e) {}

        try {
          if (window.Android && typeof window.Android.triggerNativeAlert === "function") {
            window.Android.triggerNativeAlert(payload);
          }
        } catch (e) {}
      }

      function nudgeSoundAndVibration(strong) {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) {
            if (!window.__swSurvivalCtx) window.__swSurvivalCtx = new Ctx();
            const ctx = window.__swSurvivalCtx;
            if (ctx.state === "suspended") {
              ctx.resume().catch(function () {});
            }
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = strong ? "sawtooth" : "sine";
            osc.frequency.setValueAtTime(strong ? 980 : 780, now);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(strong ? 0.28 : 0.14, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + (strong ? 0.35 : 0.16));
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + (strong ? 0.38 : 0.18));
          }
        } catch (e) {}

        try {
          if (navigator.vibrate) {
            navigator.vibrate(strong ? [600, 250, 600, 250, 700] : [250, 120, 250]);
          }
        } catch (e) {}
      }

      function applyIncomingCoords(coords, sourceLabel) {
        if (!coords || typeof coords.latitude !== "number" || typeof coords.longitude !== "number") return;
        lastBridgeFixAt = Date.now();
        logMsg(sourceLabel || "BRIDGE_GPS", `${coords.latitude.toFixed(5)}, ${coords.longitude.toFixed(5)}`);
        try {
          window.dispatchEvent(new CustomEvent("stopway:gps-position", { detail: { coords: coords } }));
        } catch (e) {}
        if (typeof window.__stopwayEvaluateCoords === "function") {
          try {
            window.__stopwayEvaluateCoords(coords);
          } catch (e) {
            logMsg("EVAL_ERR", String(e && e.message || e));
          }
        }
      }

      function handleNativeMessage(rawData) {
        let data = rawData;
        if (typeof data === "string") {
          try {
            data = JSON.parse(data);
          } catch (e) {
            return;
          }
        }
        if (!data || typeof data !== "object") return;

        const msgType = data.type || data.event || data.action || "";
        if (msgType === "STOPWAY_GPS_POSITION" || msgType === "GPS_POSITION" || msgType === "locationUpdate") {
          const coords = data.coords || (
            typeof data.latitude === "number" && typeof data.longitude === "number"
              ? { latitude: data.latitude, longitude: data.longitude, accuracy: data.accuracy || 0 }
              : null
          );
          applyIncomingCoords(coords, "NATIVE_POS");
        } else if (msgType === "STOPWAY_PERM_STATE") {
          logMsg("NATIVE_PERM", JSON.stringify(data));
          try {
            window.postMessage(data, "*");
          } catch (e) {}
        } else if (msgType === "STOPWAY_ALARM_SIGNAL" || msgType === "TRIGGER_ALARM") {
          pendingAlarmPayload = data;
          logMsg("NATIVE_ALARM", data.reason || data.message || "riasztás");
          nudgeSoundAndVibration(true);
          const overlay = document.getElementById("alarmOverlay");
          if (overlay && document.visibilityState === "visible") {
            overlay.classList.add("active");
          }
          if (data.coords) {
            applyIncomingCoords(data.coords, "ALARM_POS");
          }
        } else if (msgType === "STOPWAY_IDLE_SIGNAL" || msgType === "STOPWAY_RECONNECT_SIGNAL") {
          logMsg("NATIVE_SIGNAL", msgType + (data.message ? ": " + data.message : ""));
          nudgeSoundAndVibration(false);
        }
      }

      window.addEventListener("message", function (ev) {
        handleNativeMessage(ev && ev.data);
      });

      window.StopWayReceive = handleNativeMessage;

      // Figyeli, ha az alarmOverlay aktívvá válik (célponthoz érkezés vagy teszt riasztás)
      const alarmOverlayEl = document.getElementById("alarmOverlay");
      if (alarmOverlayEl && typeof MutationObserver !== "undefined") {
        let wasActive = alarmOverlayEl.classList.contains("active");
        const obs = new MutationObserver(function () {
          const isNowActive = alarmOverlayEl.classList.contains("active");
          if (isNowActive && !wasActive) {
            const heading = document.getElementById("alarmHeading");
            const sub = document.getElementById("alarmSub");
            callNativeAlertBridge(
              heading ? heading.textContent : "Cél-ébresztő",
              sub ? sub.textContent : "Elérted a célkörzetet!",
              "ARRIVAL_ALARM"
            );
          }
          wasActive = isNowActive;
        });
        obs.observe(alarmOverlayEl, { attributes: true, attributeFilter: ["class"] });
      }

      // Figyeli a 90 mp-es jelkimaradás buborék megjelenését is
      const signalBubbleObserver = new MutationObserver(function () {
        const bubble = document.getElementById("sw-90s-signal-bubble");
        const bubbleTxt = document.getElementById("sw-90s-signal-bubble-text");
        if (bubble && bubble.classList.contains("open")) {
          callNativeAlertBridge(
            "GPS jel megszakadt",
            bubbleTxt ? bubbleTxt.textContent : "90 másodpercenként újra próbálunk csatlakozni.",
            "SIGNAL_LOST"
          );
        }
      });
      signalBubbleObserver.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class"] });

      function probeNow(reason) {
        const stopBtn = document.getElementById("stopWatchBtn");
        const isActive = Boolean(stopBtn && stopBtn.style.display !== "none");
        logMsg("PROBE", reason + (isActive ? " (watch=ON)" : " (watch=OFF)"));
        if (!isActive || !navigator.geolocation) return;

        navigator.geolocation.getCurrentPosition(
          function (pos) {
            if (pos && pos.coords) {
              applyIncomingCoords(pos.coords, "PROBE_GPS");
            }
          },
          function (err) {
            const sinceBridge = lastBridgeFixAt ? Math.round((Date.now() - lastBridgeFixAt) / 1000) : -1;
            logMsg("PROBE_ERR", `${err && err.message ? err.message : "no fix"} (lastBridge=${sinceBridge}s)`);
            try {
              window.dispatchEvent(new CustomEvent("stopway:gps-error", { detail: { error: err } }));
            } catch (e) {}
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 9000 }
        );
      }

      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") {
          probeNow("resume_visible");
          if (pendingAlarmPayload) {
            const overlay = document.getElementById("alarmOverlay");
            if (overlay && !overlay.classList.contains("active")) {
              overlay.classList.add("active");
            }
            nudgeSoundAndVibration(true);
            pendingAlarmPayload = null;
          }
        } else {
          logMsg("BG_ENTER", "alkalmazás háttérbe került");
        }
      });

      window.addEventListener("focus", function () {
        probeNow("window_focus");
      });

      logMsg("SURVIVAL_INIT", "Háttér-túlélő és natív riasztóhíd aktív");
    })();
  </script>
