<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cél-ébresztő (StopWake)</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
      color: #38bdf8;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }
    input {
      background: #334155;
      color: #f8fafc;
    }
    button {
      background: #38bdf8;
      color: #04131d;
      font-weight: bold;
      cursor: pointer;
    }
    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: #0f172a;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Cél-ébresztő (StopWake)</h1>
    <p>Add meg a napi célodat és az ébresztési időpontot.</p>
    <label for="goal">Napi cél:</label>
    <input id="goal" type="text" placeholder="Pl. Reggeli séta" />
    <label for="alarmTime">Ébresztő időpontja:</label>
    <input id="alarmTime" type="time" value="07:00" />
    <button onclick="saveAlarm()">Beállítás mentése</button>
    <div id="status">Még nincs elmentett ébresztő.</div>
  </div>
  <script>
    function saveAlarm() {
      const goal = document.getElementById("goal").value.trim() || "Napi cél";
      const time = document.getElementById("alarmTime").value;
      document.getElementById("status").textContent =
        "Mentve: " + time + " — Cél: " + goal;
    }
  </script>
</body>
</html>
