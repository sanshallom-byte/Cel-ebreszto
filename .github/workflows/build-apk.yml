name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java 17 beállítása
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Függőségek telepítése
        run: npm install

      - name: Capacitor Android projekt létrehozása és szinkronizálása
        run: |
          npm run build || true
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android || true
          fi
          touch android/capacitor.settings.gradle

      - name: GPS, háttérszolgáltatás, rezgés és hálózati engedélyek hozzáadása
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            python3 - << 'PYEOF'
          p = "android/app/src/main/AndroidManifest.xml"
          with open(p, "r", encoding="utf-8") as f:
              txt = f.read()

          perms = [
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_BACKGROUND_LOCATION",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_LOCATION",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.WAKE_LOCK",
              "android.permission.VIBRATE",
              "android.permission.INTERNET"
          ]
          for perm in perms:
              tag = f'<uses-permission android:name="{perm}" />'
              if tag not in txt:
                  txt = txt.replace("<application", tag + "\n    <application", 1)

          service_tag = """        <service
              android:name=".StopWayLocationService"
              android:enabled="true"
              android:exported="false"
              android:foregroundServiceType="location" />"""
          if "StopWayLocationService" not in txt:
              txt = txt.replace("</application>", service_tag + "\n    </application>", 1)

          with open(p, "w", encoding="utf-8") as f:
              f.write(txt)
          PYEOF
          fi

      - name: Natív háttér-GPS szolgáltatás és WebView híd létrehozása
        run: |
          python3 - << 'PYEOF'
          import glob, os, re

          matches = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)
          main_java = matches[0] if matches else "android/app/src/main/java/com/example/app/MainActivity.java"
          os.makedirs(os.path.dirname(main_java), exist_ok=True)

          pkg_name = "com.example.app"
          if os.path.exists(main_java):
              with open(main_java, "r", encoding="utf-8") as f:
                  m = re.search(r"^package\s+([^;]+);", f.read(), re.MULTILINE)
                  if m:
                      pkg_name = m.group(1).strip()

          pkg_dir = os.path.join("android/app/src/main/java", *pkg_name.split("."))
          os.makedirs(pkg_dir, exist_ok=True)

          service_code = f"""package {pkg_name};

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import androidx.core.app.ActivityCompat;
          import androidx.core.app.NotificationCompat;

          public class StopWayLocationService extends Service {{
              public static final String CHANNEL_ID = "stopway_gps_channel";
              public static final int NOTIF_ID = 7071;
              public static final String ACTION_START = "STOPWAY_START_GPS";
              public static final String ACTION_STOP = "STOPWAY_STOP_GPS";
              public static volatile boolean isServiceRunning = false;

              private LocationManager locationManager;
              private PowerManager.WakeLock wakeLock;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private boolean running = false;

              private final LocationListener listener = new LocationListener() {{
                  @Override
                  public void onLocationChanged(Location loc) {{
                      if (loc != null && running) {{
                          MainActivity.dispatchLocationToWebView(
                              loc.getLatitude(),
                              loc.getLongitude(),
                              loc.getAccuracy()
                          );
                      }}
                  }}
                  @Override public void onStatusChanged(String provider, int status, Bundle extras) {{}}
                  @Override public void onProviderEnabled(String provider) {{}}
                  @Override public void onProviderDisabled(String provider) {{}}
              }};

              private final Runnable pollRunnable = new Runnable() {{
                  @Override
                  public void run() {{
                      if (!running) return;
                      requestSingleFix();
                      handler.postDelayed(this, 10000);
                  }}
              }};

              @Override
              public void onCreate() {{
                  super.onCreate();
                  locationManager = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                  createChannel();
              }}

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {{
                  String action = intent != null && intent.getAction() != null ? intent.getAction() : ACTION_START;
                  if (ACTION_STOP.equals(action)) {{
                      stopTracking();
                      stopForeground(true);
                      stopSelf();
                      return START_NOT_STICKY;
                  }}
                  startForeground(NOTIF_ID, buildNotification());
                  if (!running) {{
                      startTracking();
                  }}
                  return START_STICKY;
              }}

              private void startTracking() {{
                  stopTracking();
                  running = true;
                  isServiceRunning = true;
                  acquireWakeLock();
                  requestUpdates();
                  requestSingleFix();
                  handler.postDelayed(pollRunnable, 10000);
              }}

              private void stopTracking() {{
                  running = false;
                  isServiceRunning = false;
                  handler.removeCallbacksAndMessages(null);
                  if (locationManager != null) {{
                      try {{
                          locationManager.removeUpdates(listener);
                      }} catch (Exception ignored) {{}}
                  }}
                  releaseWakeLock();
              }}

              private void requestUpdates() {{
                  if (locationManager == null || !running) return;
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED &&
                      ActivityCompat.checkSelfPermission(this, Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {{
                      return;
                  }}
                  try {{
                      if (locationManager.isProviderEnabled(LocationManager.GPS_PROVIDER)) {{
                          locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 4000L, 2f, listener, Looper.getMainLooper());
                      }}
                  }} catch (Exception ignored) {{}}
                  try {{
                      if (locationManager.isProviderEnabled(LocationManager.NETWORK_PROVIDER)) {{
                          locationManager.requestLocationUpdates(LocationManager.NETWORK_PROVIDER, 5000L, 2f, listener, Looper.getMainLooper());
                      }}
                  }} catch (Exception ignored) {{}}
              }}

              private void requestSingleFix() {{
                  if (locationManager == null || !running) return;
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED &&
                      ActivityCompat.checkSelfPermission(this, Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {{
                      return;
                  }}
                  try {{
                      Location lastGps = locationManager.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                      Location lastNet = locationManager.getLastKnownLocation(LocationManager.NETWORK_PROVIDER);
                      Location best = lastGps != null ? lastGps : lastNet;
                      if (best != null && running) {{
                          MainActivity.dispatchLocationToWebView(best.getLatitude(), best.getLongitude(), best.getAccuracy());
                      }}
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {{
                          String provider = locationManager.isProviderEnabled(LocationManager.GPS_PROVIDER)
                              ? LocationManager.GPS_PROVIDER
                              : (locationManager.isProviderEnabled(LocationManager.NETWORK_PROVIDER) ? LocationManager.NETWORK_PROVIDER : null);
                          if (provider != null) {{
                              locationManager.getCurrentLocation(provider, null, getMainExecutor(), loc -> {{
                                  if (loc != null && running) {{
                                      MainActivity.dispatchLocationToWebView(loc.getLatitude(), loc.getLongitude(), loc.getAccuracy());
                                  }}
                              }});
                          }}
                      }}
                  }} catch (Exception ignored) {{}}
              }}

              private void acquireWakeLock() {{
                  try {{
                      releaseWakeLock();
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {{
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "StopWay:LocationWakeLock");
                          wakeLock.acquire(4 * 60 * 60 * 1000L);
                      }}
                  }} catch (Exception ignored) {{}}
              }}

              private void releaseWakeLock() {{
                  try {{
                      if (wakeLock != null && wakeLock.isHeld()) {{
                          wakeLock.release();
                      }}
                  }} catch (Exception ignored) {{}}
                  wakeLock = null;
              }}

              private void createChannel() {{
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {{
                      NotificationChannel ch = new NotificationChannel(
                          CHANNEL_ID,
                          "Cél-ébresztő háttér-GPS",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }}
              }}

              private Notification buildNotification() {{
                  return new NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("Cél-ébresztő")
                      .setContentText("Háttér-GPS figyelés aktív")
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setOngoing(true)
                      .build();
              }}

              @Override
              public void onTaskRemoved(Intent rootIntent) {{
                  stopTracking();
                  stopSelf();
                  super.onTaskRemoved(rootIntent);
              }}

              @Override
              public void onDestroy() {{
                  stopTracking();
                  super.onDestroy();
              }}

              @Override
              public IBinder onBind(Intent intent) {{
                  return null;
              }}
          }}
          """

          main_code = f"""package {pkg_name};

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.location.LocationManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {{
              private static MainActivity instance;
              private long lastStatusPushMs = 0L;
              private long lastGpsDispatchMs = 0L;
              private String lastStatusKey = "";

              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  instance = this;

                  if (getBridge() != null && getBridge().getWebView() != null) {{
                      WebView wv = getBridge().getWebView();
                      wv.getSettings().setJavaScriptEnabled(true);
                      wv.getSettings().setDomStorageEnabled(true);
                      StopWayBridge bridge = new StopWayBridge(this);
                      wv.addJavascriptInterface(bridge, "StopWayNative");
                      wv.addJavascriptInterface(bridge, "Android");
                  }}
              }}

              public boolean isLocationProviderOn() {{
                  try {{
                      LocationManager lm = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                      if (lm == null) return false;
                      return lm.isProviderEnabled(LocationManager.GPS_PROVIDER)
                          || lm.isProviderEnabled(LocationManager.NETWORK_PROVIDER);
                  }} catch (Exception e) {{
                      return false;
                  }}
              }}

              public boolean hasLocationPermission() {{
                  boolean fine = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                  boolean coarse = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                  return fine || coarse;
              }}

              public void requestNeededPermissions() {{
                  List<String> req = new ArrayList<>();
                  if (!hasLocationPermission()) {{
                      req.add(Manifest.permission.ACCESS_FINE_LOCATION);
                      req.add(Manifest.permission.ACCESS_COARSE_LOCATION);
                  }}
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {{
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {{
                          req.add(Manifest.permission.POST_NOTIFICATIONS);
                      }}
                  }}
                  if (!req.isEmpty()) {{
                      ActivityCompat.requestPermissions(this, req.toArray(new String[0]), 1001);
                  }}
              }}

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {{
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  pushCurrentStatusToWebView(true);
              }}

              public void startServiceTracking() {{
                  boolean locOn = isLocationProviderOn();
                  boolean locPerm = hasLocationPermission();
                  if (!locOn || !locPerm) {{
                      if (!locPerm) {{
                          requestNeededPermissions();
                      }}
                      pushCurrentStatusToWebView(true);
                      return;
                  }}
                  if (!StopWayLocationService.isServiceRunning) {{
                      Intent intent = new Intent(this, StopWayLocationService.class);
                      intent.setAction(StopWayLocationService.ACTION_START);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {{
                          ContextCompat.startForegroundService(this, intent);
                      }} else {{
                          startService(intent);
                      }}
                  }}
                  pushCurrentStatusToWebView(false);
              }}

              public void stopServiceTracking() {{
                  if (StopWayLocationService.isServiceRunning) {{
                      Intent intent = new Intent(this, StopWayLocationService.class);
                      intent.setAction(StopWayLocationService.ACTION_STOP);
                      try {{
                          startService(intent);
                      }} catch (Exception ignored) {{}}
                  }}
                  pushCurrentStatusToWebView(true);
              }}

              public void pushCurrentStatusToWebView(boolean force) {{
                  final boolean locEnabled = isLocationProviderOn();
                  final boolean locPerm = hasLocationPermission();
                  final boolean bgActive = locEnabled && locPerm && StopWayLocationService.isServiceRunning;
                  final String key = locEnabled + ":" + locPerm + ":" + bgActive;
                  final long now = System.currentTimeMillis();

                  if (key.equals(lastStatusKey)) {{
                      if ((now - lastStatusPushMs) < 3500L) {{
                          return;
                      }}
                  }} else {{
                      if (!force && (now - lastStatusPushMs) < 1200L) {{
                          return;
                      }}
                  }}
                  lastStatusKey = key;
                  lastStatusPushMs = now;

                  runOnUiThread(() -> {{
                      if (getBridge() == null || getBridge().getWebView() == null) return;
                      String js = "javascript:(function(){{" +
                          "var msg={{type:'STOPWAY_PERM_STATE',locationEnabled:" + locEnabled +
                          ",locationPermission:" + locPerm + ",backgroundEnabled:" + bgActive + "}};" +
                          "if(window.StopWayReceive){{window.StopWayReceive(msg);}}" +
                          "}})();";
                      getBridge().getWebView().evaluateJavascript(js, null);
                  }});
              }}

              public static void dispatchLocationToWebView(double lat, double lng, float acc) {{
                  MainActivity act = instance;
                  if (act == null || !act.isLocationProviderOn() || !act.hasLocationPermission()) return;
                  final long now = System.currentTimeMillis();
                  if ((now - act.lastGpsDispatchMs) < 3000L) return;
                  act.lastGpsDispatchMs = now;

                  act.runOnUiThread(() -> {{
                      if (act.getBridge() == null || act.getBridge().getWebView() == null) return;
                      String js = "javascript:(function(){{" +
                          "var msg={{type:'STOPWAY_GPS_POSITION',coords:{{latitude:" + lat +
                          ",longitude:" + lng + ",accuracy:" + acc + "}}}};" +
                          "if(window.StopWayReceive){{window.StopWayReceive(msg);}}" +
                          "}})();";
                      act.getBridge().getWebView().evaluateJavascript(js, null);
                  }});
              }}

              public static class StopWayBridge {{
                  private final MainActivity activity;
                  public StopWayBridge(MainActivity activity) {{ this.activity = activity; }}

                  @JavascriptInterface
                  public void startNonstopLocation(String json) {{ activity.startServiceTracking(); }}

                  @JavascriptInterface
                  public void enableBackgroundAndNonstopGps(String json) {{ activity.startServiceTracking(); }}

                  @JavascriptInterface
                  public void stopNonstopLocation(String json) {{ activity.stopServiceTracking(); }}

                  @JavascriptInterface
                  public void reconnectLocation(String json) {{ activity.startServiceTracking(); }}

                  @JavascriptInterface
                  public void pollLocation(String json) {{ activity.pushCurrentStatusToWebView(false); }}

                  @JavascriptInterface
                  public void checkLocationService(String json) {{ activity.pushCurrentStatusToWebView(false); }}

                  @JavascriptInterface
                  public void enableLocationService(String json) {{
                      activity.runOnUiThread(() -> {{
                          if (!activity.isLocationProviderOn()) {{
                              try {{
                                  activity.startActivity(new Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS));
                              }} catch (Exception ignored) {{}}
                          }} else if (!activity.hasLocationPermission()) {{
                              activity.requestNeededPermissions();
                          }}
                          activity.pushCurrentStatusToWebView(true);
                      }});
                  }}

                  @JavascriptInterface
                  public void requestLocationPermission(String json) {{
                      activity.runOnUiThread(activity::requestNeededPermissions);
                  }}

                  @JavascriptInterface
                  public void ensureBackgroundRunning(String json) {{ activity.startServiceTracking(); }}

                  @JavascriptInterface
                  public void disableBackgroundLocation(String json) {{ activity.stopServiceTracking(); }}
              }}
          }}
          """

          with open(os.path.join(pkg_dir, "StopWayLocationService.java"), "w", encoding="utf-8") as f:
              f.write(service_code.lstrip())

          with open(main_java, "w", encoding="utf-8") as f:
              f.write(main_code.lstrip())
          PYEOF

      - name: Saját alkalmazásikon beállítása
        run: |
          ICON_SRC=""
          if [ -f "www/icon.png" ]; then
            ICON_SRC="www/icon.png"
          elif [ -f "www/icon.jpg" ]; then
            ICON_SRC="www/icon.jpg"
          fi

          if [ -n "$ICON_SRC" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in android/app/src/main/res/mipmap-*dpi; do
              if [ -d "$dir" ]; then
                cp "$ICON_SRC" "$dir/ic_launcher.png"
                cp "$ICON_SRC" "$dir/ic_launcher_round.png"
                cp "$ICON_SRC" "$dir/ic_launcher_foreground.png"
              fi
            done
          fi

      - name: Debug APK lefordítása
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK feltöltése letölthető csomagként
        uses: actions/upload-artifact@v4
        with:
          name: Cel-Ebreszto-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
